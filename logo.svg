<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Brand gradient: cyan -> mint, oriented in the growth direction -->
    <linearGradient id="brand-grad" x1="70" y1="312" x2="340" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#00E5A0" />
    </linearGradient>

    <!-- Cut the trendline out behind the data nodes (works on any background) -->
    <mask id="node-cut">
      <rect width="400" height="400" fill="white" />
      <circle cx="145" cy="250" r="15" />
      <circle cx="205" cy="275" r="15" />
    </mask>
  </defs>

  <!-- Globe wireframe -->
  <g fill="none" stroke="url(#brand-grad)">
    <circle cx="200" cy="210" r="110" stroke-width="7" />
    <ellipse cx="200" cy="210" rx="110" ry="38" stroke-width="4" opacity="0.85" />
    <ellipse cx="200" cy="210" rx="38" ry="110" stroke-width="4" opacity="0.85" />
  </g>
  <circle cx="200" cy="210" r="5" fill="#00E5A0" />

  <!-- Rising trendline -->
  <polyline points="70,312 145,250 205,275 322,124" mask="url(#node-cut)" fill="none" stroke="url(#brand-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Small arrowhead -->
  <polygon points="339,102 334,141 302,117" fill="#00E5A0" />

  <!-- Data nodes -->
  <g fill="none" stroke="url(#brand-grad)" stroke-width="6">
    <circle cx="145" cy="250" r="11" />
    <circle cx="205" cy="275" r="11" />
  </g>
</svg>